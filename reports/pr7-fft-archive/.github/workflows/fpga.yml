name: FPGA resource and timing benchmark

on:
  # Integrations measure all 20 P&R configurations; PRs measure only benchmark inputs.
  push:
    branches: [main]
  pull_request:
    # PR paths match the entire cumulative diff. Do not list this YAML here,
    # or a CI-only PR change will re-run all 20 P&R jobs on every subsequent push.
    # Use workflow_dispatch to validate workflow-only changes before integration.
    paths:
      - 'rtl/benchmark_top.sv'
      - 'rtl/psram_ctrl.sv'
      - 'rtl/rs204_188_compact.sv'
      - 'rtl/viterbi_k7_16acs.sv'
      - 'rtl/viterbi_k7_32acs.sv'
      - 'experiments/rs_syndrome_constants.sv'
      - 'experiments/gf256_constants_tb.sv'
      - 'ci/performance.json'
      - 'ci/report.py'
      - 'ci/run_pnr.sh'
      - 'ci/validate_pnr_evidence.py'
      - 'constraints/**'
      - 'tests/test_rtl.py'
      - 'tests/test_report.py'
      - 'tests/test_validate_pnr_evidence.py'
      - 'tests/fixtures/**'
      - 'tests/*_tb.sv'
  workflow_dispatch:

concurrency:
  # Supersede obsolete PR runs without cancelling intentionally dispatched runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Shared benchmark and controller unittests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical oracle for the full unittest suite
        run: python3 -m pip install numpy==2.2.6
      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-04"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check benchmark and controller transactions once per run
        run: python3 -m unittest discover -s tests -v

  pnr:
    name: ${{ matrix.board }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [9k, 20k]
        variant: [core-only, mem, viterbi-only, rs-only]
        include:
          - board: 9k
            variant: core-32acs
          - board: 9k
            variant: mem-32acs
          - board: 9k
            variant: viterbi-32acs
          - board: 9k
            variant: core-32acs-rsconst
            pnr_seed: 1
          - board: 9k
            variant: mem-32acs-rsconst
            pnr_seed: 1
          - board: 20k
            variant: core-32acs
          - board: 20k
            variant: mem-32acs
          - board: 20k
            variant: viterbi-32acs
          - board: 20k
            variant: core-32acs-rsconst
          - board: 20k
            variant: mem-32acs-rsconst

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-04"
          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Synthesize and measure (P&R for full designs)
        id: pnr
        timeout-minutes: 15
        continue-on-error: true
        run: bash ci/run_pnr.sh "${{ matrix.board }}" "${{ matrix.variant }}" --seed "${{ matrix.pnr_seed || 4 }}"

      - name: Publish job summary
        if: always()
        run: |
          if test -f build/summary.md; then
            cat build/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.board }}-${{ matrix.variant }}
          path: |
            build/synth.ys
            build/synth.log
            build/pnr.log
            build/report.json
            build/summary.md
          if-no-files-found: warn

      - name: Validate CAD outcome and retain actual 110 MHz timing misses
        if: always()
        run: |
          python3 ci/validate_pnr_evidence.py \
            --board "${{ matrix.board }}" \
            --variant "${{ matrix.variant }}" \
            --target-mhz 110 \
            --outcome "${{ steps.pnr.outcome }}"

  feasibility-9k:
    name: 9k / ${{ matrix.variant }} / 65 MHz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [core-32acs-rsconst, mem-32acs-rsconst]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-04"
          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Synthesize and measure (P&R for full designs)
        id: pnr
        timeout-minutes: 15
        continue-on-error: true
        run: bash ci/run_pnr.sh 9k "${{ matrix.variant }}" --freq 65 --seed 1

      - name: Publish job summary
        if: always()
        run: |
          if test -f build/summary.md; then
            cat build/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-9k-${{ matrix.variant }}-65mhz
          path: |
            build/synth.ys
            build/synth.log
            build/pnr.log
            build/report.json
            build/summary.md
          if-no-files-found: warn

      - name: Validate 65 MHz feasibility CAD result
        if: always()
        run: |
          python3 ci/validate_pnr_evidence.py \
            --board 9k \
            --variant "${{ matrix.variant }}" \
            --target-mhz 65 \
            --outcome "${{ steps.pnr.outcome }}"
