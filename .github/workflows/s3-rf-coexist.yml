name: S3 RF application coexistence link diagnostic
on:
  pull_request:
    paths:
      - 'ci/s3_rf_coexist_probe.py'
      - 'ci/s3_startup_memory_bound.py'
      - 'tests/test_s3_startup_memory_bound.py'
      - 'experiments/s3_fft_tiles.*'
      - 'experiments/s3_memory_probe/**'
      - '.github/workflows/s3-rf-coexist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link:
    strategy:
      fail-fast: false
      matrix:
        profile: [native-quarter-fft, native-quarter-pool4]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ESPARGOS/esp-sdr
          ref: e74f2a470972ec163c247f1fe88d32e08579242a
          path: build/esp-sdr
          submodules: recursive
      - name: Measure RF call graph with new static reservations
        env:
          RF_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 ci/s3_rf_coexist_probe.py
      - run: python3 -m unittest discover -s tests -p test_s3_startup_memory_bound.py -v
      - name: Audit startup stacks against the generous internal heap bound
        shell: bash
        run: |
          python3 ci/s3_startup_memory_bound.py --profile ${{ matrix.profile }} \
            --elf build/s3-rf-coexist/${{ matrix.profile }}/idf/esp_sdr.elf \
            --map build/s3-rf-coexist/${{ matrix.profile }}/idf/esp_sdr.map \
            --sdkconfig build/s3-rf-coexist/${{ matrix.profile }}/idf/config/sdkconfig.json \
            --output build/s3-rf-coexist/${{ matrix.profile }}/startup-bound.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-rf-${{ matrix.profile }}-link-only-do-not-flash
          path: |
            build/s3-rf-coexist/${{ matrix.profile }}/result.json
            build/s3-rf-coexist/${{ matrix.profile }}/startup-bound.json
            build/s3-rf-coexist/${{ matrix.profile }}/build.log
            build/s3-rf-coexist/${{ matrix.profile }}/idf/*.map
            build/s3-rf-coexist/${{ matrix.profile }}/idf/*.elf
            build/s3-rf-coexist/${{ matrix.profile }}/idf/config/sdkconfig.json
            build/esp-sdr/main/targets/esp32s3/receiver.c
          retention-days: 30
