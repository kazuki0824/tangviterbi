name: FPGA joint dual-ingress FFT area
on:
  pull_request:
    paths:
      - 'experiments/dual_s3_ingress_joint_fft_area_top.sv'
      - 'ci/fpga_joint_ingress_fft_area.py'
      - '.github/workflows/fpga-joint-ingress-fft-area.yml'
jobs:
  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synthesize co-resident physical SPI ingress and FFT/K7/memory
        run: python3 ci/fpga_joint_ingress_fft_area.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-ingress-joint-fft-area
          path: |
            build/dual-ingress-joint-fft/result.json
            build/dual-ingress-joint-fft/yosys.log
