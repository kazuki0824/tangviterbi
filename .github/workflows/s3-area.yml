name: S3 zero-DSP RS area comparison
on:
  pull_request:
    paths:
      - 'experiments/gf256_boolean.sv'
      - 'experiments/s3_rs_area.py'
      - 'experiments/s3_rs_schedule.py'
      - 'experiments/s3_rs_isdb.py'
      - 'experiments/s3_rs_deadline.py'
      - 'experiments/check_isdb_rs.py'
      - 'experiments/compare_rs.py'
      - 'ci/s3_area_benchmark.py'
      # Deliberately exclude this workflow YAML from the cumulative PR paths.
      # Dispatch manually when the CI definition itself changes.
      - 'tests/test_s3_rs_area.py'
      - 'tests/rs_schedule_tb.sv'
      - 'tests/rs_budget_tb.sv'
      # ci/s3_area_benchmark.py compiles these legacy benchmark modules only.
      - 'rtl/benchmark_top.sv'
      - 'rtl/psram_ctrl.sv'
      - 'rtl/rs204_188_compact.sv'
      - 'rtl/viterbi_k7_16acs.sv'
      - 'rtl/viterbi_k7_32acs.sv'
      - 'experiments/s3_stream_schedule.py'
      - 'tests/test_s3_stream_schedule.py'
      - 'experiments/rs_syndrome_constants.sv'
  workflow_dispatch:
concurrency:
  # Supersede obsolete PR runs without cancelling intentionally dispatched runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  measure:
    name: zero-DSP RS / ${{ matrix.kind }} / ${{ matrix.frequency }} MHz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Prior area controls remain archived under reports/s3-area.
        kind: [isdb-predecode4]
        frequency: [99]
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check mutually exclusive operands and cycle equivalence
        run: python3 -m unittest discover -s tests -p test_s3_rs_area.py -v
      - name: Check conditional stream scheduling
        run: python3 -m unittest discover -s tests -p test_s3_stream_schedule.py -v
      - name: Compare module area and routed timing result
        run: python3 ci/s3_area_benchmark.py '${{ matrix.kind }}' --frequency '${{ matrix.frequency }}'
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-area-${{ matrix.kind }}-${{ matrix.frequency }}
          path: build/s3-area/${{ matrix.kind }}-${{ matrix.frequency }}/
          retention-days: 30
      - name: Publish result
        if: always()
        run: |
          if test -f 'build/s3-area/${{ matrix.kind }}-${{ matrix.frequency }}/result.json'; then
            echo 'Measurement completion is not a timing or receiver PASS.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat 'build/s3-area/${{ matrix.kind }}-${{ matrix.frequency }}/result.json' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
