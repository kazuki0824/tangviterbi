name: S3 receiver functional closure
on:
  pull_request:
    paths:
      - 'experiments/s3_*'
      - 'tests/test_s3_*'
      - 'ci/s3_area_benchmark.py'
      - 'ci/s3_comm_benchmark.py'
      - 'ci/s3_comm_endpoint_benchmark.py'
      - 'ci/s3_comm_evidence.py'
      - 'ci/s3_psram_benchmark.py'
      - 'ci/s3_psram_evidence.py'
      - 'ci/s3_logic_site_audit.py'
      - 'ci/s3_fec_compaction_evidence.py'
      - 'ci/s3_fec_extension_benchmark.py'
      - 'rtl/s3_*.sv'
      - '.github/workflows/s3-receiver-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests -p test_s3_capture_bridge.py -v
      - run: python3 -m unittest discover -s tests -p test_s3_native_capture.py -v
      - run: python3 -m unittest discover -s tests -p test_s3_bank_schedule.py -v
      - run: python3 -m unittest discover -s tests -p test_s3_nor_images.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: s3-capture-bridge
          path: |
            build/s3-capture/
            build/s3-native-capture/
  fec:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode independently encoded bits
        run: python3 -m unittest discover -s tests -p test_s3_viterbi_decode.py -v
      - name: Measure functional Viterbi and ISDB RS together
        run: python3 ci/s3_area_benchmark.py isdb-predecode4 --frequency 99 --receiver-viterbi --viterbi-metric modulo13-pipe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-receiver-fec
          path: |
            build/s3-viterbi/
            build/s3-area/isdb-predecode4-99-traceback-modulo13-pipe/
  new-components:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independent communication and FEC vectors
        run: |
          set -o pipefail
          mkdir -p build
          python3 -m unittest discover -s tests -p 'test_s3_*.py' -v 2>&1 | tee build/s3-compaction-all-tests.log
      - name: Measure communication IO and extended FEC
        run: |
          python3 ci/s3_comm_benchmark.py
          python3 ci/s3_comm_endpoint_benchmark.py
          python3 ci/s3_comm_endpoint_benchmark.py --pingpong
          python3 ci/s3_psram_benchmark.py
          python3 ci/s3_psram_benchmark.py --bridge
          python3 ci/s3_psram_benchmark.py --fec
          python3 ci/s3_psram_benchmark.py --compact-output
          python3 ci/s3_psram_benchmark.py --compact-b1
          python3 ci/s3_psram_benchmark.py --compact-rs
          python3 ci/s3_psram_benchmark.py --acs22
          python3 ci/s3_psram_benchmark.py --metric-q15
          python3 ci/s3_psram_benchmark.py --folded-metric
          python3 ci/s3_fec_extension_benchmark.py
          python3 ci/s3_comm_evidence.py
          python3 ci/s3_psram_evidence.py
          python3 ci/s3_fec_compaction_evidence.py --test-log build/s3-compaction-all-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-new-components-partial-design
          path: |
            build/s3-comm-area/
            build/s3-comm-pnr/
            build/s3-comm-endpoint/
            build/s3-comm-pingpong/
            build/s3-psram*/
            build/s3-memory-bridge-pnr/
            build/s3-memory-fec-pnr/
            build/s3-memory-fec-compact*/
            build/s3-rs-compact*/
            build/s3-iq-pingpong/
            build/s3-page-*/
            build/s3-rx-page-store/
            build/s3-spi-*/
            build/s3-fec-extensions/
            build/s3-tc8psk*/
            build/s3-depuncture/
            reports/s3-comm-area.json
            reports/s3-comm-endpoint.json
            reports/s3-communication-evidence/
            reports/s3-psram-evidence/
            reports/s3-psram.json
            reports/s3-memory-bridge.json
            reports/s3-memory-fec.json
            reports/s3-memory-fec-compact*.json
            reports/s3-fec-compaction-evidence/
            reports/s3-comm-pingpong.json
            reports/s3-fec-extensions.json
