name: Stage2 T Octal shared data control and credit
on:
  pull_request:
    paths:
      - 'rtl/s3_spi_t_octal_control_endpoint.sv'
      - 'rtl/s3_spi_control.sv'
      - 'rtl/s3_rf_credit.sv'
      - 'tests/test_fpga_t_octal_endpoint.py'
      - 'ci/fpga_t_octal_area.py'
      - 'rtl/dual_s3_26pin_transport_candidate.sv'
      - 'ci/fpga_dual26_transport_area.py'
      - '.github/workflows/fpga-stage2-t-octal-endpoint.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert shared Octal bus control, RF payload and credit status
        run: python3 -m unittest tests.test_fpga_t_octal_endpoint -v
      - name: Synthesize T Octal shared endpoint (even if simulation fails)
        if: always()
        run: python3 ci/fpga_t_octal_area.py
      - name: Measure combined T/S 26-pin transport area
        if: always()
        run: python3 ci/fpga_dual26_transport_area.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpga-t-octal-endpoint-evidence
          path: |
            build/fpga-t-octal-endpoint/run.log
            build/fpga-t-octal-endpoint/area.json
            build/fpga-t-octal-endpoint/yosys.log
            build/fpga-dual26-transport/result.json
            build/fpga-dual26-transport/yosys.log
