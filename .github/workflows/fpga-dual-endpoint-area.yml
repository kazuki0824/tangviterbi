name: FPGA dual endpoint area evidence
on:
  pull_request:
    paths:
      - 'experiments/dual_s3_spi_endpoints_area_top.sv'
      - 'ci/fpga_dual_endpoint_area.py'
      - 'rtl/s3_*.sv'
      - '.github/workflows/fpga-dual-endpoint-area.yml'
jobs:
  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synthesize both real physical ingress RTL endpoints
        run: python3 ci/fpga_dual_endpoint_area.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-endpoint-mapped-area
          path: |
            build/dual-endpoint-area/result.json
            build/dual-endpoint-area/yosys.log
