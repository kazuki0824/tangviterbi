name: Dual S3 20K component and deadline evidence
on:
  pull_request:
    paths:
      - 'rtl/dual_*.sv'
      - 'rtl/dual_fft_quarter_q16.hex'
      - 'rtl/rs204_188_compact.sv'
      - 'experiments/s3_rs_*.py'
      - 'experiments/check_isdb_rs.py'
      - 'experiments/dual_*.py'
      - 'tests/test_dual_*.py'
      - 'ci/dual_*_evidence.py'
      - '.github/workflows/dual-s3-20k.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  partial-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install numpy==2.3.5 yowasp-yosys==0.70.0.0.post1259 yowasp-runtime==1.96 wasmtime==47.0.1
      - name: Test conservation, fixed-point FFT, SDRAM commands, and corrected RS
        env:
          DUAL_RS_REPORT: build/dual-shared-rs-rtl.json
          DUAL_FFT_REPORT: build/dual-fft-rtl.json
          DUAL_SDRAM_REPORT: build/dual-sdram-rtl.json
          DUAL_FFT_MEMORY_REPORT: build/dual-fft-memory-rtl.json
          DUAL_FRAME_REPORT: build/dual-frame-io.json
          DUAL_FRAME_TS_REPORT: build/dual-frame-ts.json
          DUAL_T_TIME_REPORT: build/dual-t-time-unit.json
          DUAL_S_FRAME_REPORT: build/dual-s-frame-rtl.json
          DUAL_S_HOLD_REPORT: build/dual-s-hold-rtl.json
          DUAL_SDRAM_PIPELINE_REPORT: build/dual-sdram-pipeline.json
        run: |
          mkdir -p build
          python -m unittest discover -s tests -p 'test_dual_*.py' -v
          python experiments/dual_s3_deadlines.py --output build/dual-deadlines.json
          python experiments/dual_memory_contract.py --output build/dual-memory-contract.json
      - name: Check actual frame stream finite-contract admission (not full receiver)
        run: |
          python - <<'PYTHON'
          import json
          rows = json.load(open('build/dual-frame-ts.json'))['results']
          assert {r['logn'] for r in rows} == {11, 12, 13}
          assert all(r['deadline_admitted'] for r in rows), rows
          PYTHON
      - name: Check actual T buffer at half-symbol phase
        run: |
          DUAL_FRAME_TS_MODES=11 DUAL_FRAME_T_PHASE_NS=129937 DUAL_FRAME_TS_REPORT=build/dual-frame-ts-half.json python -m unittest discover -s tests -p test_dual_frame_ts.py -v
          python - <<'PYTHON'
          import json
          rows = json.load(open('build/dual-frame-ts-half.json'))['results']
          assert len(rows) == 1
          r = rows[0]
          assert r['actual_T_input_buffer'] and r['t_phase_ns'] == 129937
          assert r['deadline_admitted'], r
          assert all(int(r[k]) == 0 for k in ('t_start_wait', 't_word_wait', 't_capture_misses')), r
          PYTHON
      - name: Record longer memory stress (functional success is not queue admission)
        env:
          DUAL_FFT_MEMORY_FRAMES: '32'
          DUAL_FFT_MEMORY_MODES: '11'
          DUAL_FFT_MEMORY_PROFILES: '2'
          DUAL_FFT_MEMORY_BACKGROUND: '188.592344'
          DUAL_FFT_MEMORY_REPORT: build/dual-memory-long-stress.json
        run: python -m unittest discover -s tests -p test_dual_fft_memory.py -v
      - name: Verify bounded clients with dense ring addresses
        run: |
          DUAL_TRACE_FRAMES=32 DUAL_TRACE_MODES=11 DUAL_TRACE_REPORT=build/dual-clients-32.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
          DUAL_TRACE_FRAMES=16 DUAL_TRACE_MODES=11 DUAL_TRACE_LAYERS='[[3,4],[3,8],[7,16]]' DUAL_TRACE_REPORT=build/dual-clients-worst.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
      - name: Verify actual S frame DMA with FFT and dense T traffic
        run: |
          DUAL_TRACE_REAL_S=3 DUAL_TRACE_FRAMES=128 DUAL_TRACE_MODES=11 DUAL_TRACE_LAYERS='[[3,4],[3,8],[7,16]]' DUAL_TRACE_REPORT=build/dual-s-frame-fft.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
          python - <<'PYTHON'
          import json
          rows = json.load(open('build/dual-s-frame-fft.json'))['results']
          assert len(rows) == 1
          for row in rows:
              assert row['FFT_deadline_pass'], row['queue']
              assert row['client_deadline_pass'], row['queue']
              assert row['staging_64KiB_pass'], row['queue']
          PYTHON
          python experiments/dual_reorder_admission.py --output build/dual-reorder-admission.json
      - name: Verify actual T and S with FFT under the finite service contract
        run: |
          DUAL_TRACE_REAL_T=1 DUAL_TRACE_REAL_S=1 DUAL_TRACE_FRAMES=48 DUAL_TRACE_MODES=11 DUAL_TRACE_LAYERS='[[3,4],[3,8],[7,16]]' DUAL_TRACE_REPORT=build/dual-t-mode1.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
          DUAL_TRACE_REAL_T=1 DUAL_TRACE_REAL_S=1 DUAL_TRACE_FRAMES=24 DUAL_TRACE_MODES=12 DUAL_TRACE_LAYERS='[[3,2],[3,4],[7,8]]' DUAL_TRACE_REPORT=build/dual-t-mode2.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
          DUAL_TRACE_REAL_T=1 DUAL_TRACE_REAL_S=1 DUAL_TRACE_FRAMES=12 DUAL_TRACE_MODES=13 DUAL_TRACE_LAYERS='[[3,1],[3,2],[7,4]]' DUAL_TRACE_REPORT=build/dual-t-mode3.json python -m unittest discover -s tests -p test_dual_memory_trace.py -v
          python - <<'PYTHON'
          import json
          for mode in (1, 2, 3):
              rows = json.load(open(f'build/dual-t-mode{mode}.json'))['results']
              assert len(rows) == 1
              row = rows[0]
              assert row['contract']['actual_T_time_DMA']
              assert row['FFT_deadline_pass'], row
              assert row['client_deadline_pass'], row
              assert row['staging_64KiB_pass'], row
              assert row['T_single_pending_frame_pass'], row
          PYTHON
      - name: Synthesize both corrected RS table implementations (not full receiver STA)
        run: python ci/dual_shared_rs_evidence.py --yosys yowasp-yosys --output build/dual-shared-rs-synthesis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-s3-partial-evidence
          path: |
            build/dual-*.json
            build/dual-shared-rs-evidence/*.log
            build/dual-shared-rs-evidence/*.ys
            build/dual-shared-rs-evidence/*.sv

  component-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned OSS CAD Suite
        run: |
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-04/oss-cad-suite-linux-x64-20261004.tgz
          echo '8a4708629b0f0afd5a1835aca8b44d224fec5f6e544c5fd22a060ea5514f83c9  /tmp/oss-cad-suite.tgz' | sha256sum -c -
          tar -xzf /tmp/oss-cad-suite.tgz -C /tmp
      - name: Record component placement and timing failures (not receiver acceptance)
        run: python ci/dual_fft_memory_evidence.py --yosys /tmp/oss-cad-suite/bin/yosys --nextpnr /tmp/oss-cad-suite/bin/nextpnr-himbaechel --output build/dual-components-evidence
      - name: Synthesize connected memory clients and bounded FIFO
        run: python ci/dual_memory_clients_evidence.py --yosys /tmp/oss-cad-suite/bin/yosys --output build/dual-memory-clients-synth --components fifo,clients,vector,s_frame,s_clients,t_time1,t_time3,ts_clients1,ts_clients3,stream_ts1,stream_ts3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-components-placement
          path: |
            build/dual-components-evidence
            build/dual-memory-clients-synth
