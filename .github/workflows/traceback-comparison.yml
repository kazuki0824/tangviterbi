name: 9K traceback comparative evidence
on:
  pull_request:
    paths:
      - 'reports/9k-traceback-ip-comparison.md'
      - '.github/workflows/traceback-comparison.yml'
      - 'rtl/three_context_k7.sv'
      - 'experiments/three_context_k7.py'
      - 'tests/test_three_context_k7.py'
      - 'tests/test_three_context_k7_window.py'
      - 'rtl/three_context_k7_window.sv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run independent three-context baseline oracle
        run: |
          python3 -m unittest discover -s tests -p 'test_three_context_k7.py' -v
          python3 -m unittest discover -s tests -p 'test_three_context_k7_window.py' -v
      - name: Explicitly record missing paired external-IP experiment
        run: |
          echo 'Both baseline and experimental 64+64 sliding-window variant are checked against independent oracle. Any functional regression fails this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Paired P&R Fmax/resource improvement and whole-receiver feasibility remain unverified.' >> "$GITHUB_STEP_SUMMARY"
